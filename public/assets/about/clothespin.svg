<svg width="22" height="46" viewBox="0 0 22 46" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="peg-shadow" x="-5" y="-2" width="34" height="52" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <linearGradient id="peg-wood-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C28B52" />
      <stop offset="40%" stop-color="#E2B27E" />
      <stop offset="85%" stop-color="#D49E67" />
      <stop offset="100%" stop-color="#9E6E3B" />
    </linearGradient>

    <linearGradient id="peg-wood-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2B27E" />
      <stop offset="60%" stop-color="#D49E67" />
      <stop offset="100%" stop-color="#9E6E3B" />
    </linearGradient>

    <linearGradient id="metal-coil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A0A0A0" />
      <stop offset="50%" stop-color="#606060" />
      <stop offset="100%" stop-color="#303030" />
    </linearGradient>
  </defs>

  <g filter="url(#peg-shadow)">
    <!-- Back clamping leg -->
    <path d="M4 3C4 1.5 5.5 0 7.5 0H14.5C16.5 0 18 1.5 18 3V17L15.5 20.5V23.5L18 27V43C18 44.5 16.5 46 14.5 46H7.5C5.5 46 4 44.5 4 43V27L6.5 23.5V20.5L4 17V3Z" fill="#885A2E" />

    <!-- Left Arm -->
    <path d="M4.5 3C4.5 1.8 5.5 0.5 7 0.5H10V18L7.5 21V23L10 26V43C10 44.2 9 45.5 7.5 45.5C6 45.5 4.5 44.2 4.5 43V27.5L6.5 23.5V20.5L4.5 17V3Z" fill="url(#peg-wood-left)" />

    <!-- Right Arm -->
    <path d="M12 0.5H15C16.5 0.5 17.5 1.8 17.5 3V17L15.5 20.5V23.5L17.5 27.5V43C17.5 44.2 16 45.5 14.5 45.5C13 45.5 12 44.2 12 43V26L14.5 23V21L12 18V0.5Z" fill="url(#peg-wood-right)" />

    <!-- Center vertical gap slot -->
    <line x1="11" y1="2" x2="11" y2="44" stroke="#663E19" stroke-width="0.75" opacity="0.6" />

    <!-- Metal Spring Loop -->
    <!-- Spring cylinder -->
    <rect x="3.5" y="19" width="15" height="5.5" rx="2.5" fill="url(#metal-coil)" stroke="#1a1a1a" stroke-width="0.5" />
    <ellipse cx="11" cy="21.7" rx="6" ry="1.8" fill="#D0D0D0" opacity="0.4" />
    <!-- Spring wire torsion loops -->
    <path d="M6 18.5C6 15 16 15 16 18.5" stroke="#333" stroke-width="1.3" stroke-linecap="round" />
    <path d="M6 25C6 28.5 16 28.5 16 25" stroke="#222" stroke-width="1.3" stroke-linecap="round" />

    <!-- Clamp jaw contact shadow -->
    <rect x="4.5" y="38" width="13" height="5" rx="1" fill="#583515" opacity="0.3" />
  </g>
